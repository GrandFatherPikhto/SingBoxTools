# python/settings.yaml
# Единый источник правды для generate_config.py.
# Относительные пути (links_file, output_file) резолвятся от папки этого файла.

# IP, на котором слушают входящие прокси
listen_ip: 10.95.2.1

# Файл с VLESS-ссылками (по одной на строку)
# links_file: links.txt
# links_file: vpnd.vless.ip.io.txt
links_file: vpnd.vless.reality.io.txt

# Куда сохранять итоговый конфиг sing-box
output_file: config.json

# Префиксы тегов, которые НЕ попадают в пул auto-select
# (например, флаги стран), но остаются доступны как отдельные серверы
exclude_from_auto:
- "🇷🇺"

# Параметры urltest-пулов (auto-select и pool-<tag>)
urltest:
  url: "https://gstatic.com"
  interval: "3m"
  tolerance: 50

# Секция log итогового конфига
log:
  level: info
  timestamp: true

# Секция dns итогового конфига
# Внимание: элемент outbound в dns.rules удалён в sing-box 1.14, поэтому правила не используются.
# По умолчанию все DNS-запросы идут в final (dns-local — локальный резолвер).
# Если нужно резолвить через туннель — поменяйте final на dns-remote.
dns:
  servers:
  - type: https
    tag: dns-remote
    server: "1.1.1.1"
    path: "/dns-query"
    detour: auto-select
  - type: local
    tag: dns-local
  rules: []
  final: dns-local

# Прокси для приложений: каждый = отдельный inbound (socks/http) со своим пулом.
#   tag     — тег инбаунда
#   type    — socks | http
#   port    — порт, который указывает приложение
#   servers — список тегов серверов из links.txt (только эти).
#             Если servers пуст/опущен — пул auto-select (все, кроме exclude_from_auto)
proxies:
- tag: main-socks
  type: socks
  port: 54321

  servers:
  - 🇫🇮 Finland - Helsinki 1
  - 🇷🇴 Romania - Timisoara
  - 🇸🇮 Slovenia - Maribor
- tag: main-http
  type: http
  port: 54322

  servers:
  - 🇩🇰 Denmark - Albertslund
  - 🇩🇰 Denmark - Copenhagen
  - 🇷🇴 Romania - Bucharest
  - 🇷🇴 Romania - Constanta
  - 🇷🇴 Romania - Timisoara
  - 🇷🇸 Serbia - Belgrade
  - 🇸🇮 Slovenia - Maribor
- tag: apps-http
  type: http
  port: 54323
  servers:
  - "🇫🇮 Finland - Helsinki 1"
  - "🇳🇱 Netherlands - Amsterdam"

- tag: telegram-socks        # 1080 занят SOCKS5 от 3proxy, поэтому берём 54325
  type: socks
  port: 54325
  servers:
  - "🇫🇮 Finland - Helsinki 1"

- tag: claude-http               # HTTP-прокси для Claude, закреплён за одним сервером (Швейцария)
  type: http
  port: 54324
  servers:
  - "🇨🇾 Cyprus - Limassol"
- tag: minsk-socks
  type: http
  port: 54326
  servers:
  - "🇧🇾 Belarus - Minsk"

# Доменные маршруты поверх прокси (domain_suffix -> outbound).
# outbound может быть: тегом сервера, тегом пула (pool-<tag>), auto-select или direct.
routes:
  telegram:
    outbound: "🇫🇮 Finland - Helsinki 1"
    domains:
    - telegram.org
    - telegram.dog
    - t.me
    - tdesktop.com
  youtube:
    outbound: auto-select
    domains:
    - youtube.com
    - googlevideo.com
    - ytimg.com
