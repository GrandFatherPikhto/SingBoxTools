[pytest]
# Набор тестов живёт только в tests/: в корне проекта лежат ещё смонтированные
# исходники sing-box (./sing-box, sshfs) и системное дерево ./etc — их собирать
# не нужно, а без прав они ещё и роняют collection с PermissionError.
testpaths = tests
norecursedirs = .venv .git sing-box etc techdocs build dist
python_files = test_*.py
